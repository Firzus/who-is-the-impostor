services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: impostor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build:
      context: .
      args:
        VITE_SITE_URL: ${VITE_SITE_URL:-}
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/impostor
      NODE_ENV: production
      # Optional: seconds before a kicked player can rejoin (default: 30)
      # KICK_COOLDOWN_SECONDS: "30"
    depends_on:
      - db

volumes:
  pgdata:
